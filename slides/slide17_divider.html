
<style>
.qa-video-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity 1.2s ease;z-index:0;pointer-events:none;}
.qa-video-bg.loaded{opacity:0.18;}
.qa-overlay{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(13,27,42,0.55) 0%,rgba(13,27,42,0.92) 100%);z-index:1;}
.qa-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:100%;height:100%;padding:40px 60px;}
.qa-heading{font-size:clamp(58px,8.1vw,126px);font-family:'Nunito',sans-serif;font-weight:900;line-height:1;margin-bottom:24px;background:linear-gradient(135deg,var(--teal),var(--orange));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-2px;background-size:200% 200%;animation:shimmer 4s ease-in-out infinite;}
@keyframes shimmer{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
.qa-video-frame{position:relative;width:min(500px,85vw);border-radius:20px;overflow:hidden;box-shadow:0 0 0 1px rgba(0,188,212,0.25),0 8px 40px rgba(0,0,0,0.5);margin:16px auto;animation:floatY 5s ease-in-out infinite;cursor:pointer;transition:transform 0.3s ease,box-shadow 0.3s ease;}
.qa-video-frame:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 0 0 1.5px rgba(0,188,212,0.5),0 16px 60px rgba(0,0,0,0.6);}
.qa-frame-video{width:100%;height:auto;display:block;border-radius:20px;}
.qa-play-overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(13,27,42,0.3);border-radius:20px;transition:background 0.3s ease;z-index:3;}
.qa-video-frame:hover .qa-play-overlay{background:rgba(13,27,42,0.1);}
.qa-play-btn{width:52px;height:52px;background:rgba(0,188,212,0.9);border-radius:50%;display:flex;align-items:center;justify-content:center;box-shadow:0 0 24px rgba(0,188,212,0.6);}
.qa-pills{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:16px;}
.qa-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:9999;align-items:center;justify-content:center;}
.qa-modal.open{display:flex;}
.qa-modal-inner{position:relative;width:min(1000px,90vw);border-radius:16px;overflow:hidden;box-shadow:0 0 80px rgba(0,188,212,0.3);}
.qa-modal-video{width:100%;height:auto;display:block;}
.qa-modal-close{position:absolute;top:14px;right:16px;background:rgba(0,0,0,0.7);border:none;color:#fff;font-size:22px;width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;}
.qa-modal-close:hover{background:rgba(255,59,48,0.8);}
.qa-dot{width:14px;height:14px;border-radius:50%;background:var(--teal);margin-top:24px;animation:pulse 2s ease-in-out infinite;}
</style>

<div class="qa-modal" id="qaModal">
  <div class="qa-modal-inner">
    <button class="qa-modal-close" id="qaClose">&#x2715;</button>
    <video class="qa-modal-video" id="modalVideo" src="images/Blexia_vid.mp4" controls preload="none"></video>
  </div>
</div>

<div class="slide" style="position:relative;overflow:hidden;background:#0D1B2A;">
  <video class="qa-video-bg" id="bgVideo" src="images/Blexia_vid.mp4" autoplay loop muted playsinline preload="auto"></video>
  <div class="qa-overlay"></div>
  <div class="qa-content">
    <div style="margin-bottom:20px;">
      <span class="section-tag" style="font-size:clamp(12px,1.24vw,15px);">16 · Q &amp; A</span>
    </div>
    <h1 class="qa-heading">Questions?</h1>
    <p class="slide-subtitle" style="max-width:600px;margin:0 auto;">We are listening and thinking with you.</p>
    <div class="qa-video-frame" id="qaFrameBtn">
      <video class="qa-frame-video" id="frameVideo" style="max-height:260px;object-fit:contain;" src="images/Blexia_vid.mp4" muted loop playsinline preload="auto" autoplay></video>
      <div class="qa-play-overlay">
        <div class="qa-play-btn">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><polygon points="5,3 19,12 5,21"/></svg>
        </div>
      </div>
    </div>
    <div class="qa-pills">
      <span class="pill pill-teal">Architecture</span>
      <span class="pill pill-orange">Models</span>
      <span class="pill pill-purple">Datasets</span>
      <span class="pill pill-gold">Deployment</span>
      <span class="pill pill-green">Ethics</span>
    </div>
    <div class="qa-dot"></div>
  </div>
</div>

<script>
var bgVideo = document.getElementById("bgVideo");
var frameVideo = document.getElementById("frameVideo");
var modalVideo = document.getElementById("modalVideo");
var qaModal = document.getElementById("qaModal");
var qaClose = document.getElementById("qaClose");
var qaFrameBtn = document.getElementById("qaFrameBtn");

setTimeout(function(){
  if(bgVideo){bgVideo.muted=true;bgVideo.play().catch(function(){});}
  if(frameVideo){frameVideo.muted=true;frameVideo.play().catch(function(){});}
},300);

if(bgVideo){
  bgVideo.addEventListener("canplay",function(){
    bgVideo.classList.add("loaded");
  });
}

if(qaFrameBtn){
  qaFrameBtn.addEventListener("click",function(){
    qaModal.classList.add("open");
    modalVideo.play();
  });
}

if(qaClose){
  qaClose.addEventListener("click",function(){
    qaModal.classList.remove("open");
    modalVideo.pause();
    modalVideo.currentTime=0;
  });
}

if(qaModal){
  qaModal.addEventListener("click",function(e){
    if(e.target===qaModal){
      qaModal.classList.remove("open");
      modalVideo.pause();
      modalVideo.currentTime=0;
    }
  });
}

document.addEventListener("keydown",function(e){
  if(e.key==="Escape" && qaModal.classList.contains("open")){
    qaModal.classList.remove("open");
    modalVideo.pause();
    modalVideo.currentTime=0;
  }
});
</script>
