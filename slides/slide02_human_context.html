<link rel="stylesheet" href="../css/styles.css">
<div class="slide">
  <div class="slide-header">
    <span class="section-tag">01 · Human Context</span>
    <img src="images/blexia_logo.png" class="slide-logo" alt="B.Lexia">
  </div>

  <div style="display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;flex:1;">

    <div>
      <h2 class="slide-title anim-fade-up delay-1">
        A child struggling<br>
        <span class="accent">in silence</span>
      </h2>
      <p class="slide-body anim-fade-up delay-2" style="margin-bottom:32px;">
        Dyslexia affects reading, decoding, and spelling — yet most children go undiagnosed
        until academic failure becomes visible.
      </p>

      <div class="grid-2" style="gap:16px;">
        <div class="card card-teal anim-fade-up delay-3" style="text-align:center;">
          <div class="stat-number" data-count="10">0</div>
          <div class="stat-label">% of children affected</div>
        </div>
        <div class="card card-orange anim-fade-up delay-4" style="text-align:center;">
          <div class="stat-number" data-count="6">0</div>
          <div class="stat-label">years before diagnosis avg.</div>
        </div>
      </div>
    </div>

    <div class="anim-fade-up delay-2">
      <img src="images/child_sad_grades.png"
        style="width:100%;max-height:60vh;object-fit:contain;border-radius:16px;filter:drop-shadow(0 8px 32px rgba(0,188,212,0.2));"
        alt="Child struggling with reading">
    </div>
  </div>

  <div class="slide-footer">
    <span class="footer-text">B.Lexia · PFE 2025–2026</span>
    <span class="footer-text">02</span>
  </div>
</div>
<script>
  if (typeof animateCounters === 'function') animateCounters();
</script>
