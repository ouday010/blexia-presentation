<style>
.diag-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:9999;align-items:center;justify-content:center;}
.diag-modal.open{display:flex;}
.diag-modal-inner{position:relative;width:min(1200px,95vw);border-radius:16px;overflow:hidden;box-shadow:0 0 80px rgba(0,188,212,0.3);}
.diag-modal-inner img{width:100%;height:auto;display:block;border-radius:16px;}
.diag-modal-close{position:absolute;top:14px;right:16px;background:rgba(0,0,0,0.7);border:none;color:#fff;font-size:22px;width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10;}
.diag-modal-close:hover{background:rgba(255,59,48,0.8);}
.diag-thumb{cursor:pointer;position:relative;transition:transform 0.3s ease,box-shadow 0.3s ease;}
.diag-thumb:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 0 0 2px rgba(0,188,212,0.5),0 16px 60px rgba(0,0,0,0.6);}
.diag-expand-hint{position:absolute;bottom:10px;right:10px;background:rgba(0,188,212,0.85);color:white;font-size:11px;padding:4px 10px;border-radius:12px;font-family:'JetBrains Mono',monospace;pointer-events:none;}
</style>

<!-- Modal for Class diagram -->
<div class="diag-modal" id="classModal">
  <div class="diag-modal-inner">
    <button class="diag-modal-close" id="classClose">&#x2715;</button>
    <img src="figures/fig3_3_class_diagram.png" alt="Class diagram fullscreen">
  </div>
</div>

<div class="slide">
  <div class="slide-header">
    <span class="section-tag">11 · UML Conception</span>
    <img src="images/blexia_logo.png" class="slide-logo" alt="B.Lexia">
  </div>

  <h2 class="slide-title anim-fade-up delay-1" style="font-size:clamp(20px, 2.9vw, 38px);">
    Static Design — <span class="highlight">Class Diagram</span>
  </h2>

  <div style="flex:1;display:flex;flex-direction:column;gap:8px;">
    <p style="color:var(--teal);font-size:13px;font-weight:700;font-family:var(--font-mono);letter-spacing:2px;" class="anim-fade-up delay-1">
      CLICK TO EXPAND — <span style="color:var(--muted);font-size:11px;font-weight:400;">full resolution view</span>
    </p>
    <div class="diag-thumb anim-fade-in delay-2" id="classThumb" style="flex:1;display:flex;align-items:center;justify-content:center;position:relative;">
      <img src="figures/fig3_3_class_diagram.png"
        style="max-width:100%;max-height:72vh;object-fit:contain;border-radius:12px;filter:drop-shadow(0 8px 24px rgba(0,0,0,0.5));"
        alt="Class diagram">
      <div class="diag-expand-hint">🔍 Click to expand</div>
    </div>
  </div>

  <div class="slide-footer">
    <span class="footer-text">B.Lexia · PFE 2025–2026</span>
  </div>
</div>

<script>
var classModal = document.getElementById('classModal');
var classClose = document.getElementById('classClose');
var classThumb = document.getElementById('classThumb');

if(classThumb){ classThumb.addEventListener('click', function(){ classModal.classList.add('open'); }); }
if(classClose){ classClose.addEventListener('click', function(){ classModal.classList.remove('open'); }); }
if(classModal){ classModal.addEventListener('click', function(e){ if(e.target===classModal) classModal.classList.remove('open'); }); }
document.addEventListener('keydown', function(e){ if(e.key==='Escape') classModal.classList.remove('open'); });
</script>
